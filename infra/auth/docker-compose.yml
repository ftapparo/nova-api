services:
  auth:
    # Tag confirmada no compose oficial do Supabase (github.com/supabase/supabase,
    # atualizado em 18/09/2026). O produto foi renomeado para "Supabase Auth",
    # mas a imagem publicada continua sob o nome histórico "gotrue".
    image: supabase/gotrue:v2.196.0
    container_name: nova-auth
    restart: unless-stopped
    # Sem "depends_on": o postgres está em outra stack do Portainer
    # (API/infra/postgres/), não neste mesmo arquivo — depends_on só funciona
    # entre serviços declarados no mesmo compose. A conexão é resolvida
    # em runtime pela nova-network (nome de serviço "postgres"); a
    # checagem de prontidão fica a cargo do healthcheck abaixo, com
    # start_period generoso para tolerar o postgres ainda subindo.
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      # Role dedicado supabase_auth_admin (não o nova_app superusuário nem
      # o nova_api_app da aplicação) — isolamento de privilégio mínimo.
      # Ver API/infra/postgres/setup-roles.sql.
      GOTRUE_DB_DATABASE_URL: postgres://${SUPABASE_AUTH_ADMIN_USER}:${SUPABASE_AUTH_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Funciona: confirmado pelo log de migração criando auth.schema_migrations,
      # auth.users, auth.refresh_tokens etc. Sem esta variável, o GoTrue usaria
      # "public" por padrão.
      GOTRUE_DB_NAMESPACE: auth

      GOTRUE_SITE_URL: ${API_EXTERNAL_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}

      # "false" desde 28/09/2026, para o login com Google: no fluxo id_token
      # é o próprio GoTrue quem cria a conta no primeiro login, e com signup
      # desligado ele recusa. Seguro porque o GoTrue não tem porta publicada
      # e a nova-api não repassa o /signup dele — o cadastro por e-mail
      # continua passando só por POST /v3/api/auth/signup. Toda conta nasce
      # sem papel (pendente) até ser vinculada ao cadastro do Firebird.
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # GOTRUE_JWT_DEFAULT_GROUP_NAME removida: log confirmou
      # "DEPRECATION NOTICE ... not supported by Supabase's GoTrue, will be
      # removed soon" — variável obsoleta, sem efeito na v2.196.0.
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-900}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"

      # Contas entram já confirmadas, mesmo com SMTP: o cadastro já depende
      # do vínculo manual com o Firebird para liberar qualquer acesso, então
      # confirmar o e-mail seria um passo a mais sem ganho de segurança.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

      # SMTP — usado hoje só pela recuperação de senha (POST
      # /v3/api/auth/password/recover). Sem SMTP_HOST o GoTrue não envia
      # e-mail e a recuperação não funciona; o resto do login não depende.
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: "Condomínio Nova Residence"

      # Recuperação por código de 6 dígitos, não por link: o link padrão
      # aponta para o próprio GoTrue, que não é exposto. O template com o
      # código é servido pela nova-api na rede interna (porta da v3).
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://nova-api:3031/v3/api/auth/email-templates/recovery
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Código para redefinir sua senha"
      GOTRUE_MAILER_OTP_LENGTH: 6
      # 15 min (padrão do GoTrue é 24 h — longo demais para um código).
      GOTRUE_MAILER_OTP_EXP: 900
      # Limite global de e-mails por hora. Todo pedido chega pela nova-api
      # (que já limita por IP e por e-mail), então o padrão baixo do GoTrue
      # viraria um teto para o condomínio inteiro.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100

      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      # Login com Google pelo app (grant_type=id_token): o app obtém o
      # id_token do Google no próprio celular e a nova-api repassa. CLIENT_ID
      # aceita lista separada por vírgula — incluir os client IDs de todas
      # as plataformas (web, Android, iOS), senão o token daquela plataforma
      # é recusado por audience. SECRET e REDIRECT_URI são exigidos pela
      # validação de config do GoTrue ao habilitar o provedor, mesmo sem
      # fluxo de redirect.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_IDS:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
    networks:
      - nova-network
    # Sem "ports": só a nova-api fala com este serviço, via
    # http://auth:9999 dentro da nova-network.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nova-network:
    external: true
    name: nova-network
